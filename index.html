<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e6">
<title>포켓몬 놀이터 · 미니게임 10종</title>
<meta name="description" content="5살 친구들을 위한 포켓몬 미니게임 10종. 쉬움·보통·어려움 난이도와 32가지 그림 도안, 틀려도 괜찮아요!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23fff' stroke='%233b3355' stroke-width='7'/%3E%3Cpath d='M6 50h88' stroke='%233b3355' stroke-width='7'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23fff' stroke='%233b3355' stroke-width='7'/%3E%3Cpath d='M6 50a44 44 0 0 1 88 0z' fill='%23ff8fb1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body>
<div class="bg-decor" aria-hidden="true">
  <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
  <div class="bg-hills"></div>
</div>

<header id="topbar" class="topbar">
  <button id="home-btn" class="icon-btn home-btn" aria-label="놀이터로 돌아가기" title="놀이터">
    <span aria-hidden="true">🏠</span>
  </button>
  <div class="topbar-title">
    <span class="poke-ball mini" aria-hidden="true"></span>
    <span id="topbar-title">포켓몬 놀이터</span>
  </div>
  <div class="topbar-right">
    <div id="star-pill" class="pill star-pill" title="모은 별">
      <span class="pill-icon" aria-hidden="true"><svg class="ic-star" viewBox="0 0 24 24"><path d="M12 2.4l2.95 5.98 6.6.96-4.78 4.66 1.13 6.57L12 17.47 6.1 20.57l1.13-6.57L2.45 9.34l6.6-.96z"/></svg></span><span id="star-count">0</span>
    </div>
    <button id="sound-btn" class="icon-btn" aria-label="소리 켜기/끄기" title="소리">
      <span id="sound-icon" aria-hidden="true">🔊</span>
    </button>
  </div>
</header>

<main id="screen" class="screen" tabindex="-1"></main>

<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<div id="toast-layer" class="toast-layer" aria-live="polite"></div>
<div id="modal-layer" class="modal-layer" aria-live="polite"></div>

<noscript><p style="padding:24px;text-align:center">이 놀이터를 즐기려면 브라우저에서 자바스크립트를 켜 주세요!</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
